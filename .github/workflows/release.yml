name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build all binaries
        run: cross build --release --target ${{ matrix.target }} --bins

      - name: Package release tarball
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="nexusmesh-${tag}-${{ matrix.target }}"
          stage="dist/${name}"
          mkdir -p "$stage/bin" "$stage/packaging" "$stage/config"

          for bin in nexus-server nexus-agent nexus nexus-tui; do
            install -m 0755 "target/${{ matrix.target }}/release/${bin}" "$stage/bin/${bin}"
          done
          cp packaging/*.service "$stage/packaging/"
          cp packaging/*.example  "$stage/config/" 2>/dev/null || true

          # Best-effort strip — the cross images carry target binutils.
          find "$stage/bin" -type f -exec strip {} \; 2>/dev/null || true

          tar -czf "dist/${name}.tar.gz" -C dist "$name"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -la dist/

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
